<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Document</title>
</head>

<body>
    <section class="singleCard">
        <div class="card card2">
            <img src="https://images.unsplash.com/photo-1503602642458-232111445657?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D">

            <div class="saleTag">
                <p>50% Off</p>
            </div>

            <div class="time">
                <div id="days">
                    <h3>02</h3>
                    <p>Days</p>
                </div>
                <div id="hours">
                    <h3>12</h3>
                    <p>Hours</p>
                </div>
                <div id="mins">
                    <h3>47</h3>
                    <p>Mins</p>
                </div>
                <div id="sec">
                    <h3>28</h3>
                    <p>Secs</p>
                </div>
            </div>

            <div class="itemTitle">
                <h3>AerOline Pro Chair</h3>
                <h4>⭐4.9</h4>
            </div>
            <p id="title">Jet Black with Amber Stitch</p>
            <p id="price">$280.00 <span>$550.00</span></p>
        </div>

    </section>
</body>

</html>
