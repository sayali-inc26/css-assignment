<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Document</title>
</head>
<body>
    
    <div class="profileMain">
        <div class="profilePicSection">
            <img src="https://img.magnific.com/free-vector/white-color-background-gradient-abstract-modern_343694-2130.jpg?semt=ais_hybrid&w=740&q=80" alt="profileBackground">
            <div class="avatarImage">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRXFNGWEVzi9XqhhW-ZpLnRnWP8iz9_Eo8O5cmqFuS9Hw&s=10" alt="avatar image">
            </div>

            <div class="userInfo">
                <div>
                    <h3 id="userName">Alice Marline</h3>
                    <button>Follow</button>

                </div>
                <h4 id="designation">UI/UX Designer</h4>
                
                <h4 id="description"> Building Website and Webapps with Seamless User Experience Across Devices.</h4>

                <div class="stats">
                    <div class="likes">
                        <h2>88.6k</h2>
                        <h4>Likes</h4>
                    </div>
                    <div class="posts">
                        <h2>894</h2>
                        <h4>Posts</h4>
                    </div>
                    <div class="followers">
                        <h2>7.2k</h2>
                        <h4>Followers</h4>
                    </div>
                </div>

            </div>

        </div>
    </div>
    
</body>
</html>
